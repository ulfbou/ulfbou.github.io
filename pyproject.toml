[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ulfbou-site"
version = "0.1.0"
description = "Static publication platform for ulfbou.github.io"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Ulf Bourelius" },
]
dependencies = []

[project.scripts]
ulfbou-site = "ulfbou_site.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/ulfbou_site"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=ulfbou_site",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ulfbou_site"]

[tool.coverage.report]
show_missing = true
skip_covered = false

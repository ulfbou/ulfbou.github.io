name: Deploy portfolio

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore Ulfbou.Portfolio.slnx

      - name: Compile approved portfolio projection
        shell: bash
        run: |
          dotnet run --project src/Ulfbou.Portfolio.Generator/Ulfbou.Portfolio.Generator.csproj -- \
            src/content \
            src/Ulfbou.Site/wwwroot/data/generated/portfolio.json
          git diff --exit-code -- src/Ulfbou.Site/wwwroot/data/generated/portfolio.json

      - run: dotnet test Ulfbou.Portfolio.slnx -c Release

      - run: dotnet publish src/Ulfbou.Site/Ulfbou.Site.csproj -c Release -o publish

      - name: Verify deployment data authority
        shell: bash
        run: |
          test -f publish/wwwroot/data/generated/portfolio.json
          test ! -e publish/wwwroot/data/portfolio.json

      - run: |
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4
